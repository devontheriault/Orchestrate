[package]
name = "claudewrapper"
version = "0.1.0"
description = "Lightweight control layer for Claude Code — spawn, monitor, and control agents in isolated Git worktrees."
authors = ["Devon Theriault <dev.theriault@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claudewrapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Hands a URL to the OS browser, so links in an Agent's output go somewhere
# other than this window — navigating it would replace the app with the page.
tauri-plugin-opener = "2"
# Reads a pasted image straight off the OS clipboard. WebKitGTK only hands a
# paste event the clipboard's file paths, never its image data, so on Linux a
# screenshot can't be pasted through the webview at all. `image` encodes the
# pixels arboard hands back as a PNG for `claude` to read.
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde-well-known", "formatting", "macros"] }
thiserror = "2"
rand = "0.9"
dirs = "6"
# Only used to ask Anthropic which models this user can run. rustls rather than
# native-tls so the app doesn't need a system OpenSSL.
reqwest = { version = "0.13", features = ["json", "rustls"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "net", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
