[package]
name = "orchestrate"
version = "0.4.1"
description = "Lightweight control layer for Claude Code — spawn, monitor, and control agents in isolated Git worktrees."
authors = ["Devon Theriault <dev.theriault@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orchestrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what lets a macOS window be transparent (see
# `build_main_window`); `app.macOSPrivateApi` in `tauri.conf.json` has to match.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# Hands a URL to the OS browser, so links in an Agent's output go somewhere
# other than this window — navigating it would replace the app with the page.
tauri-plugin-opener = "2"
# Tells the user when an Agent needs them: a Turn Completed with nothing
# queued, a Fail, or a Queue held. The window may be buried or on another
# workspace, which is exactly when it matters.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde-well-known", "formatting", "macros"] }
thiserror = "2"
rand = "0.9"
dirs = "6"
# Only used to ask Anthropic which models this user can run. rustls rather than
# native-tls so the app doesn't need a system OpenSSL.
reqwest = { version = "0.13", features = ["json", "rustls"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "net", "signal"] }
# Attachments cross to the Host inside JSON, which has no bytes of its own.
base64 = "0.22"
# The Calendar Space (ADR 0017). `rrule` expands repeating Calendar events
# across time zones and DST, and brings `chrono` and `chrono-tz` with it;
# `roxmltree` reads CalDAV's XML; `iana-time-zone` names the Host's own zone,
# for times that give none. Its sign-ins' PKCE challenge uses Mail's `sha2`.
rrule = "0.14"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
roxmltree = "0.21"
iana-time-zone = "0.1"
# `orchestrate --mcp`, the server Agents and other MCP clients reach every
# Space through (ADR 0017). schemars writes each tool's input schema from the
# struct its arguments arrive in; it is the version rmcp itself uses.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
schemars = "1"

# The Mail Space (ADR 0017): IMAP with IDLE, over rustls as reqwest already is,
# with the same platform verifier. mail-parser reads what the server sends,
# and ammonia sanitizes its HTML, which is untrusted.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
mail-parser = "0.11"
ammonia = "4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Gmail's OAuth sign-in: the PKCE challenge, and the redirect it comes back on.
sha2 = "0.10"
url = "2"

# Reads a pasted image straight off the OS clipboard. WebKitGTK only hands a
# paste event the clipboard's file paths, never its image data, so on Linux a
# screenshot can't be pasted through the webview at all. `image` encodes the
# pixels arboard hands back as a PNG for `claude` to read. A phone's webview
# hands the page the image itself, and arboard doesn't build for one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Notes (ADR 0017): watching the notes folder, so an edit made in another
# editor or by an Agent shows up in every window, and deleting a note to the
# system trash rather than for good. A phone has no Host to keep notes on.
notify = "8"
trash = "5"

# Takes iOS's form bar off the keyboard (see `hide_form_bar`). Already in the
# build through Tauri's own iOS code; this names it so the app can use it too.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Host's named pipe is made readable by its own user only, which tokio
# has no safe way to ask for.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
# Stands in for Google's servers in the Calendar Space's tests.
wiremock = "0.6"
# The other end of `--mcp`, to test it the way an MCP client uses it.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
