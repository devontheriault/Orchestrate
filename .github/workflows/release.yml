# Builds the release installers for every platform and attaches them to a
# draft GitHub Release. Push a tag matching the app version to run it:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# See docs/releasing.md for why Linux builds here and not on a dev machine.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A tag that disagrees with tauri.conf.json would publish installers whose
  # version doesn't match the release they're attached to.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi

  build:
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner on purpose: an AppImage or .deb only runs
          # on systems with a glibc at least as new as the one it was built on.
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy is itself an AppImage; extracting it instead of mounting
          # it means the build doesn't depend on the runner having libfuse2.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: v__VERSION__
          releaseName: Claude Wrapper v__VERSION__
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          args: ${{ matrix.args }}
