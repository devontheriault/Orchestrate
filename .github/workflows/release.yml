# Builds the installers for every platform. Push a tag matching the app
# version to attach them to a draft GitHub Release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run it by hand from the Actions tab, on any branch, to get them as
# downloadable artifacts of the run without making a release.
#
# See docs/releasing.md for why Linux builds here and not on a dev machine.
#
# Actions are pinned to commit SHAs, not tags, because the build job holds the
# signing secrets: a moved tag can't swap in code that reads them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A tag that disagrees with tauri.conf.json would publish installers whose
  # version doesn't match the release they're attached to.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi

  build:
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner on purpose: an AppImage or .deb only runs
          # on systems with a glibc at least as new as the one it was built on.
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy is itself an AppImage; extracting it instead of mounting
          # it means the build doesn't depend on the runner having libfuse2.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Signs and notarizes the macOS app. Only the macOS build reads these.
          # See docs/releasing.md for where each one comes from.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The apps Calendar signs in to Google and Microsoft as, compiled in
          # so the installers' users only press Sign in. An unset one leaves
          # that button asking for the user's own (docs/calendar-accounts.md).
          ORCHESTRATE_GOOGLE_CLIENT_ID: ${{ secrets.ORCHESTRATE_GOOGLE_CLIENT_ID }}
          ORCHESTRATE_GOOGLE_CLIENT_SECRET: ${{ secrets.ORCHESTRATE_GOOGLE_CLIENT_SECRET }}
          ORCHESTRATE_MICROSOFT_CLIENT_ID: ${{ secrets.ORCHESTRATE_MICROSOFT_CLIENT_ID }}
        with:
          # Without a tag name it only builds, and releases nothing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: Orchestrate v__VERSION__
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          args: ${{ matrix.args }}

      # linuxdeploy bundles the runner's libwayland, but the AppImage uses the
      # host's Mesa. A newer Mesa can't create an EGL display with the older
      # libwayland, so on current distros the window stays blank. libwayland is
      # backwards compatible and every system that can run the app has it, so
      # repack without it and let the host's copy load.
      #
      # linuxdeploy's GTK hook also forces GDK_BACKEND=x11 to dodge crashes from
      # that same libwayland. Under X11 a desktop's GDK_SCALE (Omarchy sets 2)
      # blows the window up, so with libwayland gone, prefer Wayland again.
      - name: Drop bundled libwayland from the AppImage and prefer Wayland
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          appimage=$(realpath src-tauri/target/release/bundle/appimage/*.AppImage)
          cd "$RUNNER_TEMP"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          "$appimage" --appimage-extract > /dev/null
          rm squashfs-root/usr/lib/libwayland-*.so*
          # Fails the build if a newer linuxdeploy changes the line.
          hook=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          grep -q '^export GDK_BACKEND=x11' "$hook"
          sed -i 's/^export GDK_BACKEND=x11.*/export GDK_BACKEND="${GDK_BACKEND:-wayland,x11}"/' "$hook"
          rm "$appimage"
          ARCH=x86_64 ./appimagetool --no-appstream squashfs-root "$appimage"

          # tauri-action already attached the unpatched one to the draft.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name | select(endswith(".AppImage"))' \
              | xargs -r -n1 gh release delete-asset "$GITHUB_REF_NAME" -y
            gh release upload "$GITHUB_REF_NAME" "$appimage"
          fi

      - name: Keep the installers with the run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchestrate-${{ runner.os }}
          # `**` covers both target/release and the macOS universal build's
          # target/universal-apple-darwin/release.
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
